<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1100" viewBox="0 0 700 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#120a1f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b69cff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#4dd0ff" stop-opacity="0.65"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="stars" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="12" r="1.4" fill="#ffffff" opacity="0.22"/>
      <circle cx="42" cy="25" r="1.1" fill="#ffffff" opacity="0.18"/>
      <circle cx="70" cy="18" r="0.9" fill="#ffffff" opacity="0.14"/>
      <circle cx="22" cy="62" r="1.0" fill="#ffffff" opacity="0.15"/>
      <circle cx="60" cy="66" r="1.6" fill="#ffffff" opacity="0.20"/>
    </pattern>
  </defs>

  <!-- card base -->
  <rect x="30" y="30" width="640" height="1040" rx="36" fill="url(#bg)" stroke="url(#glow)" stroke-width="3"/>
  <rect x="52" y="52" width="596" height="996" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

  <!-- subtle stars + orb -->
  <rect x="52" y="52" width="596" height="996" rx="28" fill="url(#stars)" opacity="0.7"/>
  <circle cx="350" cy="350" r="320" fill="url(#orb)"/>

  <!-- central sigil -->
  <g transform="translate(350 560)">
    <circle r="210" fill="none" stroke="url(#glow)" stroke-width="3" opacity="0.85"/>
    <circle r="170" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.12"/>
    <circle r="120" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.10"/>

    <g opacity="0.9">
      <path d="M0,-135 L117,67 L-117,67 Z" fill="none" stroke="url(#glow)" stroke-width="3"/>
      <path d="M0,135 L-117,-67 L117,-67 Z" fill="none" stroke="url(#glow)" stroke-width="3" opacity="0.8"/>
      <circle r="12" fill="#ffffff" opacity="0.16"/>
    </g>

    <g filter="url(#soft)" opacity="0.5">
      <circle r="210" fill="none" stroke="#8aa4ff" stroke-width="10" opacity="0.08"/>
    </g>
  </g>

  <!-- top/bottom labels -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" fill="#ffffff" opacity="0.72" text-anchor="middle">
    <text x="350" y="150" font-size="18" letter-spacing="6">TAROT</text>
    <text x="350" y="985" font-size="12" letter-spacing="3" opacity="0.55">ARCANA</text>
  </g>
</svg>

